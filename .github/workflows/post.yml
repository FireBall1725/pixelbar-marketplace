# Puts a check's results on its pull request: the preview images go on the previews branch under pr-<number>/, and one
# comment per pull request is kept up to date. It never runs the pull request's code.
name: Post previews
on:
  workflow_run:
    workflows: ["Check items"]
    types: [completed]
permissions:
  contents: write
  pull-requests: write
  actions: read
jobs:
  post:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: preview
          path: out
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Read the pull request number
        id: pr
        run: |
          n=$(tr -cd '0-9' < out/pr.txt)
          [ -n "$n" ] || { echo "no pull request number"; exit 1; }
          echo "n=$n" >> "$GITHUB_OUTPUT"
      - name: Push the previews
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          N: ${{ steps.pr.outputs.n }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git clone --depth 1 --branch previews "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" previews 2>/dev/null; then :; else
            git init -q -b previews previews && git -C previews remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
            echo "Preview images for pull requests, written by the Post previews workflow." > previews/README.md
          fi
          rm -rf "previews/pr-${N}" && mkdir -p "previews/pr-${N}"
          find out -maxdepth 1 \( -name '*.gif' -o -name '*.png' -o -name '*.wav' -o -name '*.mp4' \) -exec cp {} "previews/pr-${N}/" \;
          git -C previews add -A
          git -C previews commit -q -m "Previews for #${N}" || echo "no change"
          git -C previews push -q origin previews
      - name: Label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          N: ${{ steps.pr.outputs.n }}
        run: |
          want=$(python3 -c 'import json; print("\n".join(json.load(open("out/result.json")).get("labels", [])))')
          have=$(gh api "repos/${REPO}/issues/${N}/labels" --jq '.[].name')
          for l in $(echo "$have" | grep -E '^(kind:|has pictures|needs changes)' || true); do echo "$want" | grep -qxF "$l" || gh api -X DELETE "repos/${REPO}/issues/${N}/labels/$(python3 -c 'import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1]))' "$l")" > /dev/null; done
          echo "$want" | while IFS= read -r l; do [ -n "$l" ] && ! echo "$have" | grep -qxF "$l" && gh api -X POST "repos/${REPO}/issues/${N}/labels" -f "labels[]=$l" > /dev/null; done || true
      - name: Comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          N: ${{ steps.pr.outputs.n }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          PREVIEWS_URL: ${{ vars.PREVIEWS_URL }}
        run: |
          base="https://github.com/${REPO}/raw/previews/pr-${N}"
          # With the previews site set up (repository variable PREVIEWS_URL), the comment links the page where sounds play.
          if [ -n "$PREVIEWS_URL" ]; then page="▶ [Watch and listen in the browser](${PREVIEWS_URL%/}/pr-${N}/)"; else page=""; fi
          sed -e "s#{{BASE}}#${base}#g" -e "s#{{PAGE}}#${page}#" out/comment.md | awk 'NF || !blank++ { if (NF) blank = 0; print }' > body.md
          printf '\n<sub>For %s. Previews come from the site simulator in tools/vendor.</sub>\n' "$SHA" >> body.md
          id=$(gh api "repos/${REPO}/issues/${N}/comments" --paginate --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- pixelbar-preview -->"))) | .id' | head -1)
          if [ -n "$id" ]; then gh api -X PATCH "repos/${REPO}/issues/comments/${id}" -F body=@body.md > /dev/null
          else gh api -X POST "repos/${REPO}/issues/${N}/comments" -F body=@body.md > /dev/null; fi
