# Keeps index.json, the list Home Assistant reads, in step with items/ on main.
name: Update index
on:
  push:
    branches: [main]
    paths: ["items/**"]
permissions:
  contents: write
jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node tools/validate.mjs
      - run: node tools/index.mjs index.json
      - name: Commit index.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json
          git commit -m "Update index.json" || exit 0
          git push
